<!DOCTYPE html>
<html>
<head>
    <title>Karaoke Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Trade+Winds&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background-image: url('/images/backgrounds/flier.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: white;
            height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr;
            padding: 10px;
            gap: 10px;
        }
        
        /* Enhanced Header with Next Up on right - DARK THEME */
        .header {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 20px;
            align-items: center;
        }
        
        .current-info {
            text-align: center;
        }
        
        .title-container {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .header h1 {
            font-family: "Trade Winds", system-ui;
            font-weight: 400;
            font-style: normal;
            font-size: 4em;
            margin-bottom: 5px;
            color: #ffeb3b;
            line-height: 1;
        }
        
        .tagline {
            font-family: "Trade Winds", system-ui;
            font-size: 1.5em;
            color: #ffeb3b;
            font-style: italic;
            opacity: 0.9;
        }
        
        .current-song {
            font-size: 1.2em;
            opacity: 0.9;
            margin-top: 10px;
        }
        
        .next-up-info {
            text-align: right;
            min-width: 200px;
        }
        
        .next-up-title {
            font-size: 1.2em;
            color: #ffeb3b;
            margin-bottom: 8px;
            font-weight: bold;
        }
        
        .next-singer {
            font-size: 1.5em;
            font-weight: bold;
            color: #ffeb3b;
            margin-bottom: 5px;
        }
        
        .next-song {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        /* Main Video Area - Takes most space */
        .video-container {
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            position: relative;
            min-height: 0;
        }
        
        #player {
            width: 100%;
            height: 100%;
            max-width: 1200px;
            max-height: 675px;
            border: none;
            border-radius: 8px;
        }
        
        .waiting-message {
            text-align: center;
            font-size: 2em;
            color: #666;
            padding: 40px;
        }
        
        /* Enhanced Controller Overlay */
        .controller-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .up-next-singer {
            font-size: 4em;
            font-weight: bold;
            color: #ffeb3b;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }
        
        .up-next-song {
            font-size: 2em;
            color: #ffffff;
            text-align: center;
            margin-bottom: 40px;
            opacity: 0.9;
        }
        
        .start-button {
            font-size: 3em;
            padding: 30px 60px;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            animation: pulse 2s infinite;
            margin-bottom: 20px;
        }
        
        .controller-instruction {
            font-size: 1.5em;
            color: #ffeb3b;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .controller-status {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.8em;
            z-index: 1001;
            color: white;
        }
        
        .controller-connected {
            border-left: 4px solid #4CAF50;
        }
        
        .controller-disconnected {
            border-left: 4px solid #f44336;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <!-- Enhanced Header with Next Up on right -->
    <div class="header">
        <div class="current-info">
            <div class="title-container">
                <h1>🎤 Wizards-oke</h1>
                <div class="tagline">- we make your singin' dreams come true!</div>
            </div>
            <div class="current-song">Waiting for the first singer...</div>
        </div>
        <div class="next-up-info">
            <div class="next-up-title">🎵 Next Up</div>
            <div id="nextUp">
                <div class="next-singer" id="nextSinger">---</div>
                <div class="next-song" id="nextSong">No one in queue</div>
            </div>
        </div>
    </div>

    <!-- Main Video Area -->
    <div class="video-container">
        <div id="player"></div>
        <div id="waitingMessage" class="waiting-message">
            Queue up songs at the sign-up station!
        </div>
    </div>

    <!-- Controller Status -->
    <div id="controllerStatus" class="controller-status controller-disconnected">
        🎮 Press SPACEBAR
    </div>

    <!-- Enhanced Controller Overlay -->
    <div id="controllerOverlay" class="controller-overlay" style="display: none;">
        <div class="up-next-singer" id="upNextSinger"></div>
        <div class="up-next-song" id="upNextSong"></div>
        <div class="controller-instruction">
            Press the button to start singing!
        </div>
        <button class="start-button" onclick="startCurrentSong()">
            🎤 START SINGING!
        </button>
        <div style="color: #ccc; margin-top: 15px; text-align: center;">
            Press <strong>SPACEBAR</strong> or any controller button
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let player;
        let currentVideoId = null;
        let gamepadIndex = null;
        let isVideoPlaying = false;
        let currentSongData = null;

        // Load YouTube IFrame API
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        // YouTube player setup
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                playerVars: {
                    'playsinline': 1,
                    'autoplay': 0,
                    'controls': 1,
                    'modestbranding': 1,
                    'rel': 0
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            console.log('YouTube player ready');
            startGamepadDetection();
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                isVideoPlaying = true;
            }
            else if (event.data === YT.PlayerState.ENDED) {
                isVideoPlaying = false;
                console.log('Video ended - showing next singer');
                showNextSingerScreen();
            }
        }

        // Show the "Start Singing" screen for next singer
        function showNextSingerScreen() {
            fetch('/api/next', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        console.log('Ready for next singer to start');
                    } else {
                        console.log('No more songs in queue');
                        resetToWaitingState();
                    }
                })
                .catch(err => console.log('Next singer error:', err));
        }

        function resetToWaitingState() {
            document.querySelector('.current-song').textContent = 'Waiting for the first singer...';
            document.getElementById('waitingMessage').style.display = 'block';
            document.getElementById('player').style.display = 'none';
            document.getElementById('controllerOverlay').style.display = 'none';
            currentVideoId = null;
            currentSongData = null;
            isVideoPlaying = false;
        }

        // Gamepad detection
        function startGamepadDetection() {
            window.addEventListener("gamepadconnected", (e) => {
                console.log('Gamepad connected:', e.gamepad.id);
                gamepadIndex = e.gamepad.index;
                updateControllerStatus(true, e.gamepad.id);
            });

            window.addEventListener("gamepaddisconnected", (e) => {
                gamepadIndex = null;
                updateControllerStatus(false);
            });

            function pollGamepads() {
                const gamepads = navigator.getGamepads();
                if (gamepadIndex !== null && gamepads[gamepadIndex]) {
                    const gamepad = gamepads[gamepadIndex];
                    if (gamepad.buttons[0].pressed || gamepad.buttons[7].pressed) {
                        if (document.getElementById('controllerOverlay').style.display === 'flex') {
                            startCurrentSong();
                        }
                        setTimeout(() => {}, 500);
                    }
                }
                requestAnimationFrame(pollGamepads);
            }
            requestAnimationFrame(pollGamepads);
        }

        function updateControllerStatus(connected, name = '') {
            const statusElement = document.getElementById('controllerStatus');
            if (connected) {
                statusElement.textContent = `🎮 ${name}`;
                statusElement.className = 'controller-status controller-connected';
            } else {
                statusElement.textContent = '🎮 Press SPACEBAR';
                statusElement.className = 'controller-status controller-disconnected';
            }
        }

        // When a new song is ready to be started
        socket.on('songStarted', (song) => {
            if (!isVideoPlaying) {
                document.getElementById('waitingMessage').style.display = 'none';
                document.getElementById('player').style.display = 'block';
                
                document.getElementById('upNextSinger').textContent = song.singer;
                document.getElementById('upNextSong').textContent = song.songTitle;
                
                currentVideoId = song.youtubeId;
                currentSongData = song;
                
                document.getElementById('controllerOverlay').style.display = 'flex';
                document.querySelector('.start-button').focus();
            }
        });

        // Start the current song
        function startCurrentSong() {
            if (currentVideoId && player && player.loadVideoById && currentSongData) {
                console.log('Starting song:', currentSongData.singer, currentVideoId);
                
                player.loadVideoById({
                    videoId: currentVideoId,
                    suggestedQuality: 'hd720'
                });
                
                document.querySelector('.current-song').textContent = currentSongData.songTitle;
                document.getElementById('controllerOverlay').style.display = 'none';
                
                isVideoPlaying = true;
            } else {
                console.log('Cannot start song - missing data');
            }
        }

        // When queue updates
        socket.on('queueUpdate', (data) => {
            if (data.queue.length > 0) {
                const nextSong = data.queue[0];
                document.getElementById('nextSinger').textContent = nextSong.singer;
                document.getElementById('nextSong').textContent = nextSong.songTitle;
            } else {
                document.getElementById('nextSinger').textContent = '---';
                document.getElementById('nextSong').textContent = 'No one in queue';
            }
            
            if (data.currentSong && !isVideoPlaying) {
                document.querySelector('.current-song').textContent = data.currentSong.songTitle;
            }
        });

        // Keyboard shortcut
        document.addEventListener('keydown', (event) => {
            if (event.code === 'Space' && document.getElementById('controllerOverlay').style.display === 'flex') {
                event.preventDefault();
                event.stopPropagation();
                console.log('Spacebar pressed - starting song');
                startCurrentSong();
            }
        });

        document.addEventListener('keydown', (event) => {
            if (event.code === 'Space' && document.getElementById('controllerOverlay').style.display !== 'flex') {
                event.preventDefault();
            }
        }, true);

        // Auto-enter fullscreen
        document.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log('Fullscreen error:', err);
                });
            }
        });
    </script>
</body>
</html>
