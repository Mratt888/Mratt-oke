<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcane Operations - Induction</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+New:wght@400;700&family=MedievalSharp&display=swap');
        
        body {
            margin: 0;
            padding: 20px;
            background: #0a0a0a;
            color: #e91e63;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            border: 3px double #e91e63;
            padding: 30px;
            background: rgba(10, 10, 10, 0.95);
            position: relative;
            box-shadow: 0 0 30px rgba(233, 30, 99, 0.3);
            min-height: 400px;
            display: flex;
            flex-direction: column;
        }
        
        .container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #e91e63, #00ff88, #e91e63, transparent);
            animation: scan 4s linear infinite;
        }
        
        h1 {
            font-family: 'MedievalSharp', cursive;
            text-align: center;
            color: #00ff88;
            font-size: 2.2em;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
            font-weight: 700;
            letter-spacing: 1px;
        }
        
        .induction-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .briefing-text {
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid #333;
            padding: 25px;
            margin: 15px 0;
            line-height: 1.6;
            flex: 1;
            overflow-y: auto;
            max-height: 300px;
        }
        
        .step-indicator {
            text-align: center;
            color: #e91e63;
            font-size: 0.9em;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #00ff88;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #333;
            border-radius: 8px;
            font-size: 16px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            text-align: center;
        }

        .form-group input:focus {
            outline: none;
            border-color: #00ff88;
            background: rgba(255,255,255,0.15);
        }
        
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        button {
            background: transparent;
            color: #00ff88;
            border: 1px solid #00ff88;
            padding: 12px 25px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 120px;
        }
        
        button:hover {
            background: rgba(0, 255, 136, 0.1);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }
        
        button:disabled {
            color: #666;
            border-color: #666;
            cursor: not-allowed;
        }
        
        .begin-button {
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            color: #000;
            font-weight: bold;
            border: none;
            animation: pulse 2s infinite;
        }
        
        .begin-button:hover {
            background: linear-gradient(135deg, #00cc6a, #00aa55);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        .skip-button {
            background: transparent;
            color: #ff4444;
            border: 1px solid #ff4444;
        }
        
        .skip-button:hover {
            background: rgba(255, 68, 68, 0.1);
            box-shadow: 0 0 15px rgba(255, 68, 68, 0.3);
        }
        
        .rules-list {
            list-style: none;
            padding: 0;
        }
        
        .rules-list li {
            margin-bottom: 12px;
            padding-left: 20px;
            position: relative;
        }
        
        .rules-list li::before {
            content: "⟡";
            color: #e91e63;
            position: absolute;
            left: 0;
        }
        
        .loading {
            text-align: center;
            color: #00ff88;
            margin: 10px 0;
            font-size: 1.1em;
        }
        
        @keyframes scan {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Arcane Operations</h1>
        <div class="step-indicator" id="stepIndicator">Step 1 of 5</div>
        
        <div class="induction-content">
            <div class="briefing-text" id="briefingText">
                <!-- Content will be populated by JavaScript -->
            </div>
            
            <div class="controls">
                <button onclick="previousStep()" id="prevBtn" style="display: none;">← Previous</button>
                <button onclick="nextStep()" id="nextBtn">Continue Induction →</button>
                <button onclick="beginOperations()" id="beginBtn" class="begin-button" style="display: none;">🎭 BEGIN OPERATIONS 🎭</button>
                <button onclick="skipBriefing()" id="skipBtn" class="skip-button">😴 I'VE ALREADY READ THIS CRAP</button>
            </div>
        </div>
    </div>

    <script>
        const inductionSteps = [
            {
                title: "Welcome, Operative",
                content: `You are about to be inducted into a covert network of arcane operatives. Your mission: complete esoteric rituals that summon a class 12 entity to this plane.<br><br>
                <strong>Honor System Protocol:</strong><br>
                We operate on mutual trust. Report missions as completed only when you've genuinely fulfilled the assignment. The class 12 entity will not suffer summoning by cheats.`
            },
            {
                title: "Operative Identification",
                content: `<div class="form-group">
                    <label for="operativeCodename">Choose Your Codename</label>
                    <input type="text" id="operativeCodename" placeholder="Enter your secret codename..." maxlength="20">
                    <div style="font-size: 0.8em; color: #888; margin-top: 5px;">
                        This will appear on the leaderboard. Choose wisely.
                    </div>
                </div>`
            },
            {
                title: "Mission Protocol",
                content: `<strong>Scoring System:</strong>
                <ul class="rules-list">
                    <li><strong>1 point per completed mission</strong></li>
                    <li><strong>Unlimited attempts</strong> - Complete as many as you can</li>
                    <li><strong>One mission at a time</strong></li>
                    <li><strong>Real-time leaderboard</strong></li>
                    <li><strong>Server-tracked progress</strong> - Save the missions page for easy access</li>
                </ul>`
            },
            {
                title: "Operative Conduct",
                content: `<ul class="rules-list">
                    <li>Be subtle but effective</li>
                    <li>Embrace the strange and unusual</li>
                    <li>Respect other operatives' missions</li>
                    <li>Remember: this is supposed to be fun</li>
                    <li>If a mission feels unsafe, skip it and get a new one</li>
                </ul>`
            },
            {
                title: "The Grand Prize",
                content: `<div style="text-align: center; padding: 20px; background: rgba(0, 255, 136, 0.1); border: 1px solid #00ff88; border-radius: 8px;">
                    <h3 style="color: #00ff88; margin-top: 0;">🏆 THE GRAND PRIZE 🏆</h3>
                    <p>The operative with the <strong>most completed rituals</strong> by the end of the night will receive a hefty prize.</p>
                    <p><em>Current leaderboard updates in real-time!</em></p>
                </div>
                <div style="text-align: center; margin-top: 20px; color: #00ff88; font-weight: bold;">
                    Induction Complete. You are ready to begin.
                </div>`
            }
        ];

        let currentStep = 0;

        function updateStep() {
            const step = inductionSteps[currentStep];
            document.getElementById('stepIndicator').textContent = `Step ${currentStep + 1} of ${inductionSteps.length}`;
            document.getElementById('briefingText').innerHTML = `<h3>${step.title}</h3>${step.content}`;
            
            // Show/hide navigation buttons
            const isFinalStep = currentStep === inductionSteps.length - 1;
            document.getElementById('prevBtn').style.display = currentStep > 0 ? 'block' : 'none';
            document.getElementById('nextBtn').style.display = isFinalStep ? 'none' : 'block';
            document.getElementById('beginBtn').style.display = isFinalStep ? 'block' : 'none';
        }

        function nextStep() {
            // Validate codename step
            if (currentStep === 1) {
                const codename = document.getElementById('operativeCodename').value.trim();
                if (!codename) {
                    alert('Please choose an operative codename!');
                    return;
                }
                if (codename.length < 2) {
                    alert('Codename must be at least 2 characters!');
                    return;
                }
                // Save codename immediately when entered
                localStorage.setItem('arcaneOperativeName', codename);
                console.log('💾 Saved codename:', codename);
            }

            if (currentStep < inductionSteps.length - 1) {
                currentStep++;
                updateStep();
            }
        }

        function previousStep() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        }

        function beginOperations() {
            // Get OR CREATE the codename
            let codename = localStorage.getItem('arcaneOperativeName');
            
            // If no codename in storage, use a fallback
            if (!codename) {
                const fallbackNames = ['Ghost', 'Shadow', 'Phantom', 'Raven', 'Vortex'];
                codename = fallbackNames[Math.floor(Math.random() * fallbackNames.length)] + Math.floor(Math.random() * 1000);
                localStorage.setItem('arcaneOperativeName', codename);
                console.log('🎭 Generated fallback codename:', codename);
            }

            const beginBtn = document.getElementById('beginBtn');
            const briefingText = document.getElementById('briefingText');
            
            if (beginBtn) {
                beginBtn.disabled = true;
                beginBtn.textContent = 'ACTIVATING...';
            }
            
            if (briefingText) {
                briefingText.innerHTML = '<div class="loading">Initializing arcane connection...</div>';
            }

            // Save/ensure operative ID
            let operativeId = localStorage.getItem('arcaneOperativeId');
            if (!operativeId) {
                operativeId = 'op_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('arcaneOperativeId', operativeId);
            }

            localStorage.setItem('arcaneBriefingCompleted', 'true');

            console.log('🚀 Activating operative:', { operativeId, codename });

            // Register with server
            fetch('/api/missions/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    operativeId: operativeId, 
                    name: codename
                })
            })
            .then(response => {
                if (!response.ok) throw new Error('Registration failed');
                return response.json();
            })
            .then(data => {
                console.log('✅ Server registration successful');
            })
            .catch(error => {
                console.log('⚠️ Server registration failed, using local mode');
            })
            .finally(() => {
                // ALWAYS redirect after a brief delay
                setTimeout(() => {
                    console.log('🔀 Redirecting to missions...');
                    window.location.href = 'missions.html';
                }, 1500);
            });
        }

        function skipBriefing() {
            // Get OR CREATE the codename
            let codename = localStorage.getItem('arcaneOperativeName');
            if (!codename) {
                const fallbackNames = ['Ghost', 'Shadow', 'Phantom', 'Raven', 'Vortex'];
                codename = fallbackNames[Math.floor(Math.random() * fallbackNames.length)] + Math.floor(Math.random() * 1000);
                localStorage.setItem('arcaneOperativeName', codename);
                console.log('🎭 Generated fallback codename (skip):', codename);
            }

            const skipBtn = document.getElementById('skipBtn');
            const briefingText = document.getElementById('briefingText');
            
            if (skipBtn) {
                skipBtn.disabled = true;
                skipBtn.textContent = 'SKIPPING...';
            }
            
            if (briefingText) {
                briefingText.innerHTML = '<div class="loading">Skipping briefing...</div>';
            }

            // Save/ensure operative ID
            let operativeId = localStorage.getItem('arcaneOperativeId');
            if (!operativeId) {
                operativeId = 'op_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('arcaneOperativeId', operativeId);
            }

            localStorage.setItem('arcaneBriefingCompleted', 'true');

            console.log('⏩ Skipping briefing for operative:', { operativeId, codename });

            // Register with server
            fetch('/api/missions/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    operativeId: operativeId, 
                    name: codename
                })
            })
            .then(response => {
                if (!response.ok) throw new Error('Registration failed');
                return response.json();
            })
            .then(data => {
                console.log('✅ Server registration successful (skip)');
            })
            .catch(error => {
                console.log('⚠️ Server registration failed, using local mode (skip)');
            })
            .finally(() => {
                // ALWAYS redirect after a brief delay
                setTimeout(() => {
                    console.log('🔀 Redirecting to missions (skip)...');
                    window.location.href = 'missions.html';
                }, 1000);
            });
        }

        // Initialize first step
        updateStep();

        // Pre-fill codename if it exists
        window.addEventListener('load', function() {
            const existingCodename = localStorage.getItem('arcaneOperativeName');
            if (existingCodename && currentStep === 1) {
                const codenameInput = document.getElementById('operativeCodename');
                if (codenameInput) {
                    codenameInput.value = existingCodename;
                }
            }
        });
    </script>
</body>
</html>
